<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinova — page introuvable</title>
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://cinova-officiel.github.io/">
  <link rel="icon" href="https://cinova.online/cinova-mark.png">
  <style>
    :root { --bg:#07070a; --gold:#c9a227; --gold2:#e8d48b; --muted:#b7b3c8; --line:#2a2a33; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif; background:radial-gradient(1200px 600px at 50% -10%, #2a1848 0%, var(--bg) 55%); color:#f4f1ea; line-height:1.55; display:flex; align-items:center; }
    main { width:min(640px, calc(100% - 32px)); margin: 0 auto; text-align:center; padding: 48px 0; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 12px 0 8px; }
    p { color: var(--muted); }
    .cta { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin: 22px 0 0; }
    .btn { display:inline-block; text-decoration:none; padding:14px 18px; border-radius:14px; font-weight:800; }
    .btn-gold { background: linear-gradient(180deg, #e8d48b, var(--gold)); color:#16120a; }
    .btn-dark { background:#1b1b24; color:#fff; border:1px solid var(--line); }
    .btn-blue { background:#229ed9; color:#fff; }
    .mark { width:72px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="https://cinova.online/cinova-mark.png" alt="Cinova">
    <h1>Cette page n’existe pas</h1>
    <p>Tu es bien sur le GitHub officiel Cinova. Voici les vrais liens — pas un catalogue.</p>
    <div class="cta">
      <a class="btn btn-gold" href="https://cinova.online">Ouvrir cinova.online</a>
      <a class="btn btn-dark" href="https://cinova.fun">Miroir cinova.fun</a>
      <a class="btn btn-blue" href="https://t.me/cinova_cg">Telegram</a>
    </div>
    <p style="margin-top:22px"><a href="./">Retour aux liens officiels</a></p>
  </main>
</body>
</html>
